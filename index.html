<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR 채용 가이드북 — 사람이 떠나지 않는 구조를 설계하다</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:#06090f;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:32px 0 56px;
  overflow-x:hidden;
  word-break:keep-all;
}

/* ── ENVIRONMENT ── */
.env-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 20% 30%, rgba(29,184,122,.07) 0%, transparent 60%),
             radial-gradient(ellipse 60% 50% at 80% 70%, rgba(10,34,64,.4) 0%, transparent 60%),
             #06090f;
}
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px;
}

/* ── BOOK SHELL ── */
#book-wrap{position:relative;z-index:10;width:980px;margin:0 auto}
#book-container{
  position:relative;width:980px;height:620px;
  perspective:4000px;
  filter:drop-shadow(0 40px 80px rgba(0,0,0,.9)) drop-shadow(0 8px 24px rgba(0,0,0,.6));
}

/* pages */
.page-static{position:absolute;top:0;width:490px;height:620px;overflow:hidden}
#page-left-static{left:0;border-radius:10px 0 0 10px}
#page-right-bg{right:0;border-radius:0 10px 10px 0}

/* ── FLIP LEAF (keyframe-driven, no transition) ── */
#flip-leaf{
  position:absolute;top:0;left:490px;width:490px;height:620px;
  transform-origin:left center;transform-style:preserve-3d;
  transform:rotateY(0deg);
  z-index:20;will-change:transform;
}
#leaf-front,#leaf-back{
  position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
}
#leaf-front{border-radius:0 10px 10px 0}
#leaf-back{transform:rotateY(180deg);border-radius:10px 0 0 10px}

/* ── NATURAL BOOK PHYSICS keyframes ── */
@keyframes flipFwd{
  0%  {transform:rotateY(0deg)}
  6%  {transform:rotateY(-9deg)}
  18% {transform:rotateY(-42deg) rotateX(1.2deg)}
  38% {transform:rotateY(-88deg) rotateX(2.2deg)}
  55% {transform:rotateY(-122deg) rotateX(1.4deg)}
  72% {transform:rotateY(-152deg) rotateX(0.4deg)}
  86% {transform:rotateY(-171deg) rotateX(0.1deg)}
  93% {transform:rotateY(-184deg)}
  97% {transform:rotateY(-178deg)}
  100%{transform:rotateY(-180deg)}
}
@keyframes flipBwd{
  0%  {transform:rotateY(-180deg)}
  3%  {transform:rotateY(-178deg)}
  7%  {transform:rotateY(-184deg)}
  14% {transform:rotateY(-171deg) rotateX(0.1deg)}
  28% {transform:rotateY(-152deg) rotateX(0.4deg)}
  45% {transform:rotateY(-122deg) rotateX(1.4deg)}
  62% {transform:rotateY(-88deg) rotateX(2.2deg)}
  82% {transform:rotateY(-42deg) rotateX(1.2deg)}
  94% {transform:rotateY(-9deg)}
  100%{transform:rotateY(0deg)}
}

/* ── SHADOW OVERLAYS ── */
#left-shadow{
  position:absolute;left:0;top:0;width:490px;height:620px;
  background:linear-gradient(to left,
    rgba(0,0,0,.30) 0%,
    rgba(0,0,0,.16) 45%,
    rgba(0,0,0,.04) 80%,
    transparent 100%);
  pointer-events:none;z-index:18;opacity:0;
  border-radius:10px 0 0 10px;
  transition:opacity 30ms linear;
}
#right-shadow{
  position:absolute;right:0;top:0;width:490px;height:620px;
  background:linear-gradient(to right,
    rgba(0,0,0,.22) 0%,
    rgba(0,0,0,.10) 40%,
    transparent 100%);
  pointer-events:none;z-index:18;opacity:0;
  border-radius:0 10px 10px 0;
  transition:opacity 30ms linear;
}
#leaf-sheen{
  position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;
  background:linear-gradient(115deg,
    transparent 20%,
    rgba(255,255,255,.05) 45%,
    rgba(255,255,255,.09) 50%,
    rgba(255,255,255,.05) 55%,
    transparent 80%);
}
#fold-crease{
  position:absolute;left:0;top:0;width:4px;height:620px;
  background:linear-gradient(to right,rgba(0,0,0,.18),transparent);
  pointer-events:none;z-index:25;opacity:0;
  transition:opacity 30ms linear;
}

/* spine */
#spine{
  position:absolute;left:490px;top:0;
  width:18px;height:620px;
  background:linear-gradient(to right,#030810,#0A2240 30%,#0f3468 50%,#0A2240 70%,#030810);
  z-index:30;transform:translateX(-9px);
  box-shadow:0 0 30px rgba(0,0,0,.5);border-radius:2px;
}

.page-static{box-shadow:inset -1px 0 6px rgba(0,0,0,.05)}
/* ── PAGE INNER STYLES ── */
.pg{
  width:490px;height:620px;overflow:hidden;position:relative;
  background:#fff;
  display:flex;flex-direction:column;
}
.pg-inner{flex:1;overflow:hidden;padding:36px 26px 20px}
.pg-footer{
  height:36px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 30px;
  border-top:1px solid #f0eeea;
  background:linear-gradient(to bottom,#fafaf7,#f5f3ed);
}
.pg-footer-text{font-size:10px;color:#8a8680;font-weight:600;letter-spacing:.06em}
.pg-footer-text:last-child{
  background:#1DB87A;color:#fff;
  padding:3px 9px;border-radius:10px;
  font-weight:800;font-size:10px;
  min-width:24px;text-align:center;
}

.pg.dark{background:#0A2240}
.pg.cover-r{background:linear-gradient(145deg,#0d3060 0%,#071428 100%)}
.pg.teal-end{background:linear-gradient(145deg,#0d6b4a 0%,#085038 100%)}

.ch-label{
  font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:#1DB87A;margin-bottom:10px;
  display:inline-flex;align-items:center;gap:6px;
  padding-left:10px;
  border-left:3px solid currentColor;
  line-height:1;
  align-self:flex-start;
}
.ch-label iconify-icon{font-size:12px}
.pg-title{
  font-size:27px;font-weight:900;line-height:1.18;color:#0A2240;
  margin-bottom:14px;word-break:keep-all;
  letter-spacing:-.018em;
}
.pg-title em{
  font-style:normal;color:#1DB87A;
  text-decoration:underline;
  text-decoration-thickness:4px;
  text-underline-offset:5px;
  text-decoration-color:rgba(29,184,122,.32);
}
.pg-subtitle{font-size:14px;font-weight:700;color:#0A2240;margin-bottom:8px;letter-spacing:-.005em}
.pg-body{font-size:12.5px;line-height:1.75;color:#4a4640;word-break:keep-all}

.divider{height:2px;background:linear-gradient(to right,#1DB87A 0%,#1DB87A 25%,rgba(29,184,122,.08) 100%);margin:10px 0 14px;border-radius:1px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{
  background:linear-gradient(135deg,#fafaf6,#f3f0e7);
  border-radius:10px;padding:15px 10px;text-align:center;
  border:1px solid #e8e5dd;
  position:relative;overflow:hidden;
}
.stat-box::after{
  content:'';position:absolute;right:-20px;top:-20px;
  width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle,rgba(29,184,122,.06),transparent 70%);
}
.stat-val{font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.022em;position:relative;z-index:1}
.stat-lbl{font-size:10.5px;color:#666;margin-top:6px;line-height:1.4;word-break:keep-all;font-weight:600;position:relative;z-index:1}

.card{border-radius:10px;padding:13px 15px;margin-bottom:9px;border:1px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.025)}
.card-teal{background:linear-gradient(135deg,#f0fbf6,#e8f6ed);border-color:#b8ead5;border-left:4px solid #1DB87A}
.card-coral{background:linear-gradient(135deg,#fdf0ef,#fbe5e3);border-color:#f5c6c2;border-left:4px solid #e8394b}
.card-amber{background:linear-gradient(135deg,#fef8ef,#fcefd9);border-color:#f5d9a8;border-left:4px solid #e67e22}
.card-navy{background:linear-gradient(135deg,#0A2240,#143354);border-color:#1a3a5c;color:#fff;box-shadow:0 3px 12px rgba(10,34,64,.18)}
.card-gray{background:linear-gradient(135deg,#f9f8f6,#f0eeea);border-color:#e8e5e0;border-left:4px solid #b8b4aa}
.card-purple{background:linear-gradient(135deg,#f4f3fd,#ebe8fa);border-color:#c9c6f0;border-left:4px solid #534AB7}

.chk-list{display:flex;flex-direction:column;gap:5px}
.chk-item{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#4a4640;line-height:1.55;word-break:keep-all}
.chk-icon{
  width:16px;height:16px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.ci-t{background:#1DB87A;color:#fff}
.ci-c{background:#e8394b;color:#fff}
.ci-a{background:#e67e22;color:#fff}
.ci-p{background:#534AB7;color:#fff}
.ci-g{background:#888;color:#fff}
.chk-icon iconify-icon{font-size:9px}

.tbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tbl th{
  background:linear-gradient(135deg,#0A2240,#143354);color:#fff;padding:9px 11px;
  text-align:left;font-weight:700;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
}
.tbl th:first-child{border-radius:6px 0 0 0}
.tbl th:last-child{border-radius:0 6px 0 0}
.tbl td{padding:8px 11px;border-bottom:1px solid #f0eeea;color:#4a4640;vertical-align:top;line-height:1.5}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:nth-child(even) td{background:#faf9f8}

.insight{
  background:linear-gradient(135deg,#0A2240 0%,#143354 100%);
  border-radius:10px;padding:16px 16px 14px;margin-bottom:10px;
  border:1px solid rgba(29,184,122,.22);
  position:relative;overflow:hidden;
  box-shadow:0 4px 14px rgba(10,34,64,.18);
}
.insight::before{
  content:'';position:absolute;right:-30px;top:-30px;
  width:100px;height:100px;background:radial-gradient(circle,rgba(29,184,122,.18),transparent 70%);border-radius:50%;
}
.insight-label{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(29,184,122,.18);color:#4ECDC4;
  padding:4px 10px;border-radius:14px;
  font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:8px;
}
.insight-text{font-size:12.5px;line-height:1.7;color:rgba(255,255,255,.92);word-break:keep-all;font-weight:500}

.blockquote{
  border-left:4px solid #1DB87A;padding:13px 14px 13px 18px;
  background:linear-gradient(135deg,#f0fbf6,#e6f6ec);
  border-radius:0 10px 10px 0;
  font-size:12.5px;font-style:italic;color:#0a4a30;line-height:1.7;
  font-weight:500;
  margin-bottom:10px;word-break:keep-all;
  position:relative;
  box-shadow:0 1px 3px rgba(29,184,122,.08);
}
.blockquote::before{
  content:'\201C';
  position:absolute;left:10px;top:-2px;
  font-size:36px;font-weight:900;color:rgba(29,184,122,.22);
  font-family:Georgia,serif;
  line-height:1;font-style:normal;
  pointer-events:none;
}

.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;letter-spacing:.04em;margin-right:4px;margin-bottom:4px;text-transform:uppercase}
.tag-t{background:#d7f5e8;color:#0a6640;border:1px solid rgba(29,184,122,.25)}
.tag-c{background:#fde8e6;color:#8a1a1a;border:1px solid rgba(232,57,75,.22)}
.tag-a{background:#fdefd5;color:#7a3c00;border:1px solid rgba(230,126,34,.25)}
.tag-p{background:#ebe9fb;color:#2e2880;border:1px solid rgba(83,74,183,.22)}
.tag-n{background:#0A2240;color:#fff}
.tag-g{background:#f0eeea;color:#4a4640;border:1px solid #e0ddd6}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cmp-box{border-radius:8px;padding:11px;font-size:11px;border:1px solid transparent}
.cmp-t{background:#f0fbf6;border-color:#b8ead5;border-top:3px solid #1DB87A}
.cmp-c{background:#fdf0ef;border-color:#f5c6c2;border-top:3px solid #e8394b}
.cmp-title{font-size:12px;font-weight:700;margin-bottom:7px;word-break:keep-all}
.cmp-item{display:flex;align-items:flex-start;gap:5px;margin-bottom:4px;font-size:10.5px;color:#4a4640;line-height:1.4;word-break:keep-all}
.cmp-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}

.phase-row{display:flex;border-radius:8px;overflow:hidden;margin-bottom:10px}
.phase-box{flex:1;padding:11px 10px}
.ph1{background:#e8394b;color:#fff}
.ph2{background:#1DB87A;color:#fff}
.ph3{background:#534AB7;color:#fff}
.ph-label{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.ph-title{font-size:12px;font-weight:700;margin-bottom:3px;word-break:keep-all}
.ph-desc{font-size:9.5px;opacity:.88;word-break:keep-all;line-height:1.45}

.timeline-item{display:flex;gap:10px;margin-bottom:8px}
.tl-dot{
  display:flex;flex-direction:column;align-items:center;flex-shrink:0;
}
.tl-badge{
  background:#1DB87A;color:#fff;border-radius:4px;
  padding:3px 7px;font-size:9px;font-weight:700;white-space:nowrap;
}
.tl-line{width:1px;flex:1;background:#d5f0e5;margin-top:4px;min-height:8px}
.tl-content{font-size:11px;color:#4a4640;line-height:1.55;padding-top:3px;word-break:keep-all}

.member-slot{
  background:repeating-linear-gradient(45deg,#f9f8f6,#f9f8f6 8px,#fff 8px,#fff 16px);
  border:2px dashed #d8d4cc;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#b0ada6;text-align:center;line-height:1.8;
}
.member-slot iconify-icon{font-size:28px;color:#ccc;margin-bottom:6px}

.co-card{border-radius:10px;overflow:hidden;margin-bottom:9px;border:1px solid #e8e5e0;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.co-head{padding:9px 12px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.co-head::after{content:'';position:absolute;right:-10px;top:-10px;width:40px;height:40px;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);border-radius:50%}
.co-name{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:-.005em}
.co-rate{font-size:9.5px;color:rgba(255,255,255,.7);margin-top:2px;font-weight:500}
.co-body{background:#faf9f8;padding:10px 12px;font-size:10.5px;color:#4a4640;line-height:1.6}

.dot-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:28px 28px;
}
.cover-accent{
  position:absolute;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(29,184,122,.15),transparent 70%);
}

.bar-item{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar-label{font-size:12px;color:#4a4640;min-width:24px;font-weight:600}
.bar-text{font-size:12px;flex:1;color:#4a4640;word-break:keep-all}
.bar-pct{font-size:13px;font-weight:700;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.bar-track{width:90px;height:7px;background:#f0eeea;border-radius:3px;overflow:hidden;flex-shrink:0}
.bar-fill{height:100%;border-radius:3px}

.toc-row{
  display:flex;align-items:baseline;gap:6px;padding:7px 0;
  border-bottom:1px dotted #e8e5e0;cursor:pointer;transition:color .18s;
}
.toc-row:hover .toc-title{color:#1DB87A}
.toc-ch{font-size:10px;font-weight:700;color:#1DB87A;min-width:34px;letter-spacing:.04em}
.toc-title{font-size:12.5px;font-weight:500;flex:1;color:#2a2520;word-break:keep-all}
.toc-pg{font-size:11px;color:#b0ada6;min-width:18px;text-align:right}

.pg-scroll{
  overflow:hidden;flex:1;
  padding:36px 26px 18px;
  display:flex;flex-direction:column;
  justify-content:space-between;
}
.pg-scroll > *{flex-shrink:0}

/* right-side pages: align content start with left-page title+divider */
.pg-r-align{padding-top:115px}

/* ── NAVIGATION ── */
#nav-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-top:14px;
}
#progress-bar{width:980px;height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
#progress-fill{height:100%;background:linear-gradient(to right,#1DB87A,#4ECDC4);border-radius:2px;transition:width .45s ease}
.nav-row{display:flex;align-items:center;gap:14px}
.nav-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s cubic-bezier(0.16,1,0.3,1);
  font-size:15px;
}
.nav-btn:hover{background:rgba(29,184,122,.2);border-color:#1DB87A;color:#fff;transform:scale(1.05)}
.nav-btn:active{transform:scale(.96)}
.nav-btn:disabled{opacity:.2;cursor:not-allowed;transform:none}
.dot-nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap;max-width:500px;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .2s}
.dot:hover{background:rgba(29,184,122,.5)}
.dot.on{background:#1DB87A;width:20px;border-radius:3px}
#page-info{font-size:11px;color:rgba(255,255,255,.35);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
#kb-hint{font-size:10px;color:rgba(255,255,255,.18);letter-spacing:.04em}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
#book-wrap{animation:fadeUp .6s ease both;position:relative}
#nav-wrap{animation:fadeUp .7s .1s ease both}

/* ── CLOSED BOOK COVER (initial state) ── */
#book-cover{
  position:absolute;width:490px;height:620px;
  left:490px;top:0;z-index:60;
  transform-origin:left center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  cursor:pointer;
  border-radius:0 12px 12px 0;
  background:
    radial-gradient(circle at 30% 22%, rgba(29,184,122,.10), transparent 60%),
    radial-gradient(circle at 80% 80%, rgba(78,205,196,.06), transparent 55%),
    linear-gradient(135deg, #0c2040 0%, #061227 50%, #02060f 100%);
  box-shadow:
    inset -1px 0 6px rgba(0,0,0,.5),
    inset 1px 0 4px rgba(0,0,0,.7),
    inset 0 0 60px rgba(0,0,0,.5),
    -10px 0 36px rgba(0,0,0,.7),
    10px 14px 60px rgba(0,0,0,.85);
  overflow:hidden;
  transition:transform .85s cubic-bezier(.4,0,.2,1), opacity .3s .45s ease-out;
  animation:coverFloatIn 1.0s cubic-bezier(.4,0,.2,1) both;
}
@keyframes coverFloatIn{
  0%  {opacity:0;transform:translateY(30px) scale(.94)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
#book-cover.opening{
  transform:perspective(2400px) rotateY(-180deg);
  opacity:0;
}

/* dotted pattern */
.cv-pattern{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 1.5px 1.5px, rgba(29,184,122,.07) 1px, transparent 0);
  background-size:22px 22px;
  opacity:.9;
}
/* corner glows */
.cv-glow-1{
  position:absolute;width:240px;height:240px;
  top:-80px;right:-80px;pointer-events:none;
  background:radial-gradient(circle, rgba(29,184,122,.22), transparent 70%);
  border-radius:50%;
}
.cv-glow-2{
  position:absolute;width:200px;height:200px;
  bottom:-60px;left:-60px;pointer-events:none;
  background:radial-gradient(circle, rgba(78,205,196,.14), transparent 70%);

}
/* inner frame */
.cv-frame{
  position:absolute;inset:24px 28px;pointer-events:none;
  border:1px solid rgba(29,184,122,.22);
  border-radius:4px;
}
/* corner brackets */
.cv-corner{
  position:absolute;width:18px;height:18px;pointer-events:none;

}
.cv-tl{top:20px;left:24px;border-right:0;border-bottom:0}
.cv-tr{top:20px;right:28px;border-left:0;border-bottom:0}
.cv-bl{bottom:20px;left:24px;border-right:0;border-top:0}
.cv-br{bottom:20px;right:28px;border-left:0;border-top:0}

/* page edges on right (3D book depth) */
.cv-spine-edge{
  position:absolute;right:-7px;top:6px;bottom:6px;
  width:7px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    #f3f0e7 0px,#f3f0e7 1px,
    #d8d2bd 1px,#d8d2bd 2px);
  border-radius:0 3px 3px 0;
  box-shadow:inset 0 0 5px rgba(0,0,0,.25);
}

/* cover content */
.cv-content{
  position:relative;z-index:5;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:62px 40px 132px;text-align:center;
}
.cv-eyebrow{
  font-size:9px;font-weight:700;
  letter-spacing:.26em;text-transform:uppercase;
  color:#4ECDC4;margin-bottom:34px;
}
.cv-emblem{
  width:78px;height:78px;border-radius:50%;
  background:rgba(29,184,122,.1);
  border:1.5px solid rgba(29,184,122,.42);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:22px;
  box-shadow:0 0 36px rgba(29,184,122,.2),inset 0 0 20px rgba(29,184,122,.08);
}
.cv-emblem iconify-icon{font-size:34px;color:#1DB87A}
.cv-line{
  width:36px;height:2px;margin-bottom:18px;
  background:linear-gradient(to right, transparent, #1DB87A, transparent);
}
.cv-title{
  font-size:24px;font-weight:800;color:#fff;
  line-height:1.28;word-break:keep-all;
  margin-bottom:2px;letter-spacing:-.01em;
}
.cv-title-em{
  font-size:26px;font-weight:900;color:#1DB87A;
  line-height:1.25;word-break:keep-all;
  letter-spacing:-.01em;margin-bottom:18px;
}
.cv-subtitle{
  font-size:10.5px;color:rgba(255,255,255,.45);
  letter-spacing:.15em;text-transform:uppercase;
  margin-bottom:24px;
}
.cv-tags{
  display:flex;gap:4px;flex-wrap:wrap;
  justify-content:center;max-width:300px;
}
.cv-tags span{
  font-size:9px;color:rgba(255,255,255,.55);
  padding:3px 9px;letter-spacing:.04em;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
}

/* Open book button */
#open-book-btn{
  position:absolute;bottom:48px;left:50%;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;
  padding:12px 26px;border:0;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:700;
  letter-spacing:.1em;color:#fff;
  background:linear-gradient(135deg,#1DB87A,#16a368);
  border-radius:24px;z-index:6;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 6px 18px rgba(29,184,122,.4),0 2px 6px rgba(29,184,122,.25);
  animation:openBtnPulse 2.4s 1.2s infinite;
}
#open-book-btn:hover{
  transform:translateX(-50%) translateY(-2px);
  box-shadow:0 10px 26px rgba(29,184,122,.5),0 3px 8px rgba(29,184,122,.3);
  animation:none;
}
#open-book-btn iconify-icon{font-size:14px;display:block}
#open-book-btn .arrow-ic{transition:transform .3s}
#open-book-btn:hover .arrow-ic{transform:translateX(3px)}
@keyframes openBtnPulse{
  0%,100%{box-shadow:0 6px 18px rgba(29,184,122,.4),0 0 0 0 rgba(29,184,122,.55)}
  50%   {box-shadow:0 6px 18px rgba(29,184,122,.4),0 0 0 14px rgba(29,184,122,0)}
}

/* When closed, hide pages/nav/bookmarks */
.book-closed-state #spine,
.book-closed-state #page-left-static,
.book-closed-state #page-right-bg,
.book-closed-state #flip-leaf,
.book-closed-state #nav-wrap,
.book-closed-state #bookmarks{
  opacity:0;pointer-events:none;
}
/* Right-side pages are hidden behind cover → instant reveal (no buffering) */
.book-opening-state #spine,
.book-opening-state #page-right-bg,
.book-opening-state #flip-leaf{
  opacity:1;
  pointer-events:auto;
}
/* Left page isn't covered → quick fade */
.book-opening-state #page-left-static{
  animation:pgReveal .3s ease-out both;
  pointer-events:auto;
}
.book-opening-state #nav-wrap,
.book-opening-state #bookmarks{
  animation:pgReveal .4s .55s ease-out both;
}
@keyframes pgReveal{
  from{opacity:0}to{opacity:1}
}

#book-container{
  animation:bookEntrance .9s cubic-bezier(.4,0,.2,1) both;
}
@keyframes bookEntrance{
  0%   {opacity:0;transform:translateY(28px) scale(.95)}
  100% {opacity:1;transform:translateY(0) scale(1)}
}

/* ── BOOKMARKS ── */
#bookmarks{

.bookmark:hover{

.bookmark.active::after{
  content:'';position:absolute;left:0;top:8px;bottom:8px;

}
.bm-num{
  font-size:13px;font-weight:900;font-style:italic;

  font-variant-numeric:tabular-nums;
}
.bm-label{

  white-space:nowrap;
}
@media (max-width: 1100px){

  .bookmark{width:34px;min-height:96px}

</style>

let cur = 0;
let isFlipping = false;
const FLIP_DUR = 680;

const leftStatic  = document.getElementById('page-left-static');
const rightBg     = document.getElementById('page-right-bg');
const flipLeaf    = document.getElementById('flip-leaf');
const leafFront   = document.getElementById('leaf-front');
const leafBack    = document.getElementById('leaf-back');
const btnPrev     = document.getElementById('btn-prev');
const btnNext     = document.getElementById('btn-next');
const pageInfo    = document.getElementById('page-info');
const dotsEl      = document.getElementById('dots');
const progressFill= document.getElementById('progress-fill');
const bookContainer=document.getElementById('book-container');

const leftShadow  = document.createElement('div'); leftShadow.id  = 'left-shadow';
const rightShadow = document.createElement('div'); rightShadow.id = 'right-shadow';
const foldCrease  = document.createElement('div'); foldCrease.id  = 'fold-crease';
const leafSheen   = document.createElement('div'); leafSheen.id   = 'leaf-sheen';
bookContainer.append(leftShadow, rightShadow);
flipLeaf.append(leafSheen, foldCrease);

let shadowRaf = null;
function animateShadow(dir, dur) {
  cancelAnimationFrame(shadowRaf);
  const t0 = performance.now();
  function tick(now) {
    const t = Math.min((now - t0) / dur, 1);
    const peakT = dir > 0 ? 0.40 : 0.58;
    const sigma = 0.32;
    const gauss = Math.exp(-0.5 * Math.pow((t - peakT) / sigma, 2));
    const shadow = gauss * 0.82;
    if (dir > 0) { leftShadow.style.opacity = shadow; rightShadow.style.opacity = 0; }
    else { leftShadow.style.opacity = 0; rightShadow.style.opacity = shadow; }
    const crease = t < 0.25 ? (t / 0.25) * 0.9 : t > 0.75 ? ((1 - t) / 0.25) * 0.9 : 0;
    foldCrease.style.opacity = crease;
    const sheen = Math.max(0, 1 - Math.abs(t - 0.50) / 0.18);
    leafSheen.style.opacity = sheen * 0.9;
    if (t < 1) shadowRaf = requestAnimationFrame(tick);
    else { leftShadow.style.opacity = 0; rightShadow.style.opacity = 0; foldCrease.style.opacity = 0; leafSheen.style.opacity = 0; }
  }
  shadowRaf = requestAnimationFrame(tick);
}

function doFlip(dir) {
  if (isFlipping) return;
  const next = cur + dir;
  if (next < 0 || next >= SPREADS.length) return;
  isFlipping = true;
  if (dir > 0) {
    leftStatic.innerHTML = SPREADS[cur][0]; rightBg.innerHTML = SPREADS[next][1];
    leafFront.innerHTML = SPREADS[cur][1]; leafBack.innerHTML = SPREADS[next][0];
    flipLeaf.style.animation = 'none'; flipLeaf.style.transform = 'rotateY(0deg)';
  } else {
    leftStatic.innerHTML = SPREADS[next][0]; rightBg.innerHTML = SPREADS[cur][1];
    leafFront.innerHTML = SPREADS[next][1]; leafBack.innerHTML = SPREADS[cur][0];
    flipLeaf.style.animation = 'none'; flipLeaf.style.transform = 'rotateY(-180deg)';
  }
  void flipLeaf.offsetWidth;
  animateShadow(dir, FLIP_DUR);
  const anim = dir > 0 ? 'flipFwd' : 'flipBwd';
  flipLeaf.style.animation = `${anim} ${FLIP_DUR}ms cubic-bezier(0.25,0.1,0.25,1.0) forwards`;
  flipLeaf.addEventListener('animationend', () => {
    cur = next;
    flipLeaf.style.animation = 'none'; flipLeaf.style.transform = 'rotateY(0deg)';
    leftStatic.innerHTML = SPREADS[cur][0]; leafFront.innerHTML = SPREADS[cur][1];
    rightBg.innerHTML = SPREADS[cur][1];
    leafBack.innerHTML = cur < SPREADS.length - 1 ? SPREADS[cur + 1][0] : '';
    render(); isFlipping = false;
  }, { once: true });
}

function flipNext() { doFlip(+1); }
function flipPrev() { doFlip(-1); }

function goTo(idx) {
  if (idx === cur || isFlipping) return;
  cur = idx;
  flipLeaf.style.animation = 'none'; flipLeaf.style.transform = 'rotateY(0deg)';
  leftStatic.innerHTML = SPREADS[cur][0]; leafFront.innerHTML = SPREADS[cur][1];
  rightBg.innerHTML = SPREADS[cur][1];
  leafBack.innerHTML = cur < SPREADS.length - 1 ? SPREADS[cur + 1][0] : '';
  render();
}

/* ── BOOKMARKS (4 major parts) ── */
const BOOKMARKS = [
  { roman: 'I',   name: 'WHY · 진단',     start: 2,  color: '#e8394b' },
  { roman: 'II',  name: 'WHAT · 인사이트', start: 5,  color: '#534AB7' },
  { roman: 'III', name: 'HOW · 실행',     start: 8,  color: '#1DB87A' },
  { roman: 'IV',  name: 'CASE · 사례',    start: 12, color: '#e67e22' },
];
const bookmarksEl = document.getElementById('bookmarks');
bookmarksEl.innerHTML = BOOKMARKS.map((b, i) =>
  `<div class="bookmark" data-idx="${i}" style="background:${b.color}" onclick="goTo(${b.start})" title="${b.name}">
    <div class="bm-num">${b.roman}</div>
    <div class="bm-label">${b.name}</div>
  </div>`
).join('');
function updateBookmarks(){
  document.querySelectorAll('.bookmark').forEach((el, i) => {
    const startIdx = BOOKMARKS[i].start;
    const nextIdx  = i + 1 < BOOKMARKS.length ? BOOKMARKS[i + 1].start : Infinity;
    el.classList.toggle('active', cur >= startIdx && cur < nextIdx);
  });
}

function render() {
  const total = SPREADS.length;
  btnPrev.disabled = cur === 0; btnNext.disabled = cur === total - 1;
  pageInfo.textContent = `${cur + 1} / ${total}`;
  const pct = total > 1 ? (cur / (total - 1)) * 100 : 0;
  progressFill.style.width = pct + '%';
  dotsEl.innerHTML = SPREADS.map((s, i) => `<div class="dot${i === cur ? ' on' : ''}" onclick="goTo(${i})"></div>`).join('');
  updateBookmarks();
}

btnNext.onclick = flipNext;
btnPrev.onclick = flipPrev;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipNext();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') flipPrev();
});

leftStatic.innerHTML = SPREADS[0][0]; leafFront.innerHTML = SPREADS[0][1];
rightBg.innerHTML = SPREADS[0][1];
leafBack.innerHTML = SPREADS.length > 1 ? SPREADS[1][0] : '';
render();

/* ── BOOK OPEN INTERACTION ── */
document.body.classList.add('book-closed-state');
let bookOpened = false;
function openBook(){
  if (bookOpened) return;
  bookOpened = true;
  const cover = document.getElementById('book-cover');
  cover.classList.add('opening');
  document.body.classList.remove('book-closed-state');
  document.body.classList.add('book-opening-state');
  setTimeout(() => {
    document.body.classList.remove('book-opening-state');
    document.body.classList.add('book-opened-state');
    cover.style.display = 'none';
  }, 950);
}
document.getElementById('book-cover').addEventListener('click', openBook);
</script>
