<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR 채용 가이드북 — 사람이 떠나지 않는 구조를 설계하다</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:#06090f;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:32px 0 56px;
  overflow-x:hidden;
  word-break:keep-all;
}

/* ── ENVIRONMENT ── */
.env-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 20% 30%, rgba(29,184,122,.07) 0%, transparent 60%),
             radial-gradient(ellipse 60% 50% at 80% 70%, rgba(10,34,64,.4) 0%, transparent 60%),
             #06090f;
}
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px;
}

/* ── BOOK SHELL ── */
#book-wrap{position:relative;z-index:10;width:980px;margin:0 auto}
#book-container{
  position:relative;width:980px;height:620px;
  perspective:4000px;
  filter:drop-shadow(0 40px 80px rgba(0,0,0,.9)) drop-shadow(0 8px 24px rgba(0,0,0,.6));
}

/* pages */
.page-static{position:absolute;top:0;width:490px;height:620px;overflow:hidden}
#page-left-static{left:0;border-radius:10px 0 0 10px}
#page-right-bg{right:0;border-radius:0 10px 10px 0}

/* ── FLIP LEAF (keyframe-driven, no transition) ── */
#flip-leaf{
  position:absolute;top:0;left:490px;width:490px;height:620px;
  transform-origin:left center;transform-style:preserve-3d;
  transform:rotateY(0deg);
  z-index:20;will-change:transform;
}
#leaf-front,#leaf-back{
  position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
}
#leaf-front{border-radius:0 10px 10px 0}
#leaf-back{transform:rotateY(180deg);border-radius:10px 0 0 10px}

/* ── NATURAL BOOK PHYSICS keyframes ── */
@keyframes flipFwd{
  0%  {transform:rotateY(0deg)}
  6%  {transform:rotateY(-9deg)}
  18% {transform:rotateY(-42deg) rotateX(1.2deg)}
  38% {transform:rotateY(-88deg) rotateX(2.2deg)}
  55% {transform:rotateY(-122deg) rotateX(1.4deg)}
  72% {transform:rotateY(-152deg) rotateX(0.4deg)}
  86% {transform:rotateY(-171deg) rotateX(0.1deg)}
  93% {transform:rotateY(-184deg)}
  97% {transform:rotateY(-178deg)}
  100%{transform:rotateY(-180deg)}
}
@keyframes flipBwd{
  0%  {transform:rotateY(-180deg)}
  3%  {transform:rotateY(-178deg)}
  7%  {transform:rotateY(-184deg)}
  14% {transform:rotateY(-171deg) rotateX(0.1deg)}
  28% {transform:rotateY(-152deg) rotateX(0.4deg)}
  45% {transform:rotateY(-122deg) rotateX(1.4deg)}
  62% {transform:rotateY(-88deg) rotateX(2.2deg)}
  82% {transform:rotateY(-42deg) rotateX(1.2deg)}
  94% {transform:rotateY(-9deg)}
  100%{transform:rotateY(0deg)}
}

/* ── SHADOW OVERLAYS ── */
#left-shadow{
  position:absolute;left:0;top:0;width:490px;height:620px;
  background:linear-gradient(to left,
    rgba(0,0,0,.30) 0%,
    rgba(0,0,0,.16) 45%,
    rgba(0,0,0,.04) 80%,
    transparent 100%);
  pointer-events:none;z-index:18;opacity:0;
  border-radius:10px 0 0 10px;
  transition:opacity 30ms linear;
}
#right-shadow{
  position:absolute;right:0;top:0;width:490px;height:620px;
  background:linear-gradient(to right,
    rgba(0,0,0,.22) 0%,
    rgba(0,0,0,.10) 40%,
    transparent 100%);
  pointer-events:none;z-index:18;opacity:0;
  border-radius:0 10px 10px 0;
  transition:opacity 30ms linear;
}
#leaf-sheen{
  position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;
  background:linear-gradient(115deg,
    transparent 20%,
    rgba(255,255,255,.05) 45%,
    rgba(255,255,255,.09) 50%,
    rgba(255,255,255,.05) 55%,
    transparent 80%);
}
#fold-crease{
  position:absolute;left:0;top:0;width:4px;height:620px;
  background:linear-gradient(to right,rgba(0,0,0,.18),transparent);
  pointer-events:none;z-index:25;opacity:0;
  transition:opacity 30ms linear;
}

/* spine */
#spine{
  position:absolute;left:490px;top:0;
  width:18px;height:620px;
  background:linear-gradient(to right,#030810,#0A2240 30%,#0f3468 50%,#0A2240 70%,#030810);
  z-index:30;transform:translateX(-9px);
  box-shadow:0 0 30px rgba(0,0,0,.5);border-radius:2px;
}

.page-static{box-shadow:inset -1px 0 6px rgba(0,0,0,.05)}
/* ── PAGE INNER STYLES ── */
.pg{
  width:490px;height:620px;overflow:hidden;position:relative;
  background:#fff;
  display:flex;flex-direction:column;
}
.pg-inner{flex:1;overflow:hidden;padding:32px 30px 28px}
.pg-footer{
  height:36px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 30px;
  border-top:1px solid #f0eeea;
}
.pg-footer-text{font-size:10px;color:#b8b4aa;font-weight:500;letter-spacing:.04em}

.pg.dark{background:#0A2240}
.pg.cover-r{background:linear-gradient(145deg,#0d3060 0%,#071428 100%)}
.pg.teal-end{background:linear-gradient(145deg,#0d6b4a 0%,#085038 100%)}

.ch-label{
  font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#1DB87A;margin-bottom:6px;
  display:flex;align-items:center;gap:5px;
}
.ch-label iconify-icon{font-size:12px}
.pg-title{
  font-size:21px;font-weight:800;line-height:1.2;color:#0A2240;
  margin-bottom:10px;word-break:keep-all;
}
.pg-title em{font-style:normal;color:#1DB87A}
.pg-subtitle{font-size:12px;font-weight:600;color:#0A2240;margin-bottom:5px}
.pg-body{font-size:11.5px;line-height:1.75;color:#4a4640;word-break:keep-all}

.divider{height:1px;background:linear-gradient(to right,#1DB87A,rgba(29,184,122,.1));margin:10px 0}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{background:#f9f8f6;border-radius:8px;padding:11px;text-align:center;border:1px solid #f0eeea}
.stat-val{font-size:22px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:9.5px;color:#888;margin-top:3px;line-height:1.4;word-break:keep-all}

.card{border-radius:8px;padding:12px 13px;margin-bottom:8px;border:1px solid transparent}
.card-teal{background:#f0fbf6;border-color:#b8ead5;border-left:3px solid #1DB87A}
.card-coral{background:#fdf0ef;border-color:#f5c6c2;border-left:3px solid #e8394b}
.card-amber{background:#fef8ef;border-color:#f5d9a8;border-left:3px solid #e67e22}
.card-navy{background:#0A2240;border-color:#1a3a5c;color:#fff}
.card-gray{background:#f9f8f6;border-color:#e8e5e0;border-left:3px solid #b8b4aa}
.card-purple{background:#f4f3fd;border-color:#c9c6f0;border-left:3px solid #534AB7}

.chk-list{display:flex;flex-direction:column;gap:5px}
.chk-item{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:#4a4640;line-height:1.5;word-break:keep-all}
.chk-icon{
  width:16px;height:16px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.ci-t{background:#1DB87A;color:#fff}
.ci-c{background:#e8394b;color:#fff}
.ci-a{background:#e67e22;color:#fff}
.ci-p{background:#534AB7;color:#fff}
.ci-g{background:#888;color:#fff}
.chk-icon iconify-icon{font-size:9px}

.tbl{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:9px}
.tbl th{
  background:#0A2240;color:#fff;padding:6px 8px;
  text-align:left;font-weight:600;font-size:9.5px;letter-spacing:.02em;
}
.tbl th:first-child{border-radius:4px 0 0 4px}
.tbl th:last-child{border-radius:0 4px 4px 0}
.tbl td{padding:5px 8px;border-bottom:1px solid #f0eeea;color:#4a4640;vertical-align:top;line-height:1.45}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:nth-child(even) td{background:#faf9f8}

.insight{
  background:linear-gradient(135deg,#0A2240 0%,#143354 100%);
  border-radius:8px;padding:13px;margin-bottom:9px;
  border:1px solid rgba(29,184,122,.2);
  position:relative;overflow:hidden;
}
.insight::before{
  content:'';position:absolute;right:-24px;top:-24px;
  width:80px;height:80px;background:rgba(29,184,122,.1);border-radius:50%;
}
.insight-label{font-size:9px;color:#4ECDC4;font-weight:700;letter-spacing:.1em;margin-bottom:4px;text-transform:uppercase}
.insight-text{font-size:11px;line-height:1.7;color:rgba(255,255,255,.88);word-break:keep-all}

.blockquote{
  border-left:3px solid #1DB87A;padding:9px 12px;
  background:#f0fbf6;border-radius:0 6px 6px 0;
  font-size:11px;font-style:italic;color:#2d4a3c;line-height:1.75;
  margin-bottom:9px;word-break:keep-all;
}

.tag{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.03em;margin-right:3px;margin-bottom:3px}
.tag-t{background:#d7f5e8;color:#0a6640}
.tag-c{background:#fde8e6;color:#8a1a1a}
.tag-a{background:#fdefd5;color:#7a3c00}
.tag-p{background:#ebe9fb;color:#2e2880}
.tag-n{background:#0A2240;color:#fff}
.tag-g{background:#f0eeea;color:#4a4640}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cmp-box{border-radius:8px;padding:11px;font-size:11px;border:1px solid transparent}
.cmp-t{background:#f0fbf6;border-color:#b8ead5;border-top:3px solid #1DB87A}
.cmp-c{background:#fdf0ef;border-color:#f5c6c2;border-top:3px solid #e8394b}
.cmp-title{font-size:12px;font-weight:700;margin-bottom:7px;word-break:keep-all}
.cmp-item{display:flex;align-items:flex-start;gap:5px;margin-bottom:4px;font-size:10.5px;color:#4a4640;line-height:1.4;word-break:keep-all}
.cmp-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}

.phase-row{display:flex;border-radius:8px;overflow:hidden;margin-bottom:10px}
.phase-box{flex:1;padding:11px 10px}
.ph1{background:#e8394b;color:#fff}
.ph2{background:#1DB87A;color:#fff}
.ph3{background:#534AB7;color:#fff}
.ph-label{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.ph-title{font-size:12px;font-weight:700;margin-bottom:3px;word-break:keep-all}
.ph-desc{font-size:9.5px;opacity:.88;word-break:keep-all;line-height:1.45}

.timeline-item{display:flex;gap:10px;margin-bottom:8px}
.tl-dot{
  display:flex;flex-direction:column;align-items:center;flex-shrink:0;
}
.tl-badge{
  background:#1DB87A;color:#fff;border-radius:4px;
  padding:3px 7px;font-size:9px;font-weight:700;white-space:nowrap;
}
.tl-line{width:1px;flex:1;background:#d5f0e5;margin-top:4px;min-height:8px}
.tl-content{font-size:11px;color:#4a4640;line-height:1.55;padding-top:3px;word-break:keep-all}

.member-slot{
  background:repeating-linear-gradient(45deg,#f9f8f6,#f9f8f6 8px,#fff 8px,#fff 16px);
  border:2px dashed #d8d4cc;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#b0ada6;text-align:center;line-height:1.8;
}
.member-slot iconify-icon{font-size:28px;color:#ccc;margin-bottom:6px}

.co-card{border-radius:8px;overflow:hidden;margin-bottom:9px;border:1px solid #e8e5e0}
.co-head{padding:8px 11px;display:flex;justify-content:space-between;align-items:center}
.co-name{font-size:12px;font-weight:700;color:#fff}
.co-rate{font-size:9.5px;color:rgba(255,255,255,.65);margin-top:1px}
.co-body{background:#faf9f8;padding:10px 11px;font-size:10.5px;color:#4a4640;line-height:1.6}

.dot-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:28px 28px;
}
.cover-accent{
  position:absolute;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(29,184,122,.15),transparent 70%);
}

.bar-item{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-label{font-size:10.5px;color:#4a4640;min-width:24px;font-weight:600}
.bar-text{font-size:10.5px;flex:1;color:#4a4640;word-break:keep-all}
.bar-pct{font-size:11px;font-weight:700;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.bar-track{width:72px;height:5px;background:#f0eeea;border-radius:3px;overflow:hidden;flex-shrink:0}
.bar-fill{height:100%;border-radius:3px}

.toc-row{
  display:flex;align-items:baseline;gap:6px;padding:6px 0;
  border-bottom:1px dotted #e8e5e0;cursor:pointer;transition:color .18s;
}
.toc-row:hover .toc-title{color:#1DB87A}
.toc-ch{font-size:9px;font-weight:700;color:#1DB87A;min-width:28px;letter-spacing:.04em}
.toc-title{font-size:11px;font-weight:500;flex:1;color:#2a2520;word-break:keep-all}
.toc-pg{font-size:10px;color:#b0ada6;min-width:18px;text-align:right}

.pg-scroll{overflow-y:auto;flex:1;padding:32px 30px 0;scrollbar-width:thin;scrollbar-color:#e0ddd8 transparent}
.pg-scroll::-webkit-scrollbar{width:3px}
.pg-scroll::-webkit-scrollbar-thumb{background:#e0ddd8;border-radius:2px}

/* ── NAVIGATION ── */
#nav-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-top:14px;
}
#progress-bar{width:980px;height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
#progress-fill{height:100%;background:linear-gradient(to right,#1DB87A,#4ECDC4);border-radius:2px;transition:width .45s ease}
.nav-row{display:flex;align-items:center;gap:14px}
.nav-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s cubic-bezier(0.16,1,0.3,1);
  font-size:15px;
}
.nav-btn:hover{background:rgba(29,184,122,.2);border-color:#1DB87A;color:#fff;transform:scale(1.05)}
.nav-btn:active{transform:scale(.96)}
.nav-btn:disabled{opacity:.2;cursor:not-allowed;transform:none}
.dot-nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap;max-width:500px;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .2s}
.dot:hover{background:rgba(29,184,122,.5)}
.dot.on{background:#1DB87A;width:20px;border-radius:3px}
#page-info{font-size:11px;color:rgba(255,255,255,.35);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
#kb-hint{font-size:10px;color:rgba(255,255,255,.18);letter-spacing:.04em}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
#book-wrap{animation:fadeUp .6s ease both}
#nav-wrap{animation:fadeUp .7s .1s ease both}
</style>
</head>
<body>
<div class="env-bg"></div>
<div class="grain"></div>

<div id="book-wrap">
<div id="book-container">
  <div id="spine"></div>
  <div id="page-left-static" class="page-static"></div>
  <div id="page-right-bg" class="page-static"></div>
  <div id="flip-leaf">
    <div id="leaf-front"></div>
    <div id="leaf-back"></div>
  </div>
</div>
</div>

<div id="nav-wrap">
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <div class="nav-row">
    <button class="nav-btn" id="btn-prev" disabled>
      <iconify-icon icon="solar:arrow-left-linear"></iconify-icon>
    </button>
    <div class="dot-nav" id="dots"></div>
    <span id="page-info">1 / 1</span>
    <button class="nav-btn" id="btn-next">
      <iconify-icon icon="solar:arrow-right-linear"></iconify-icon>
    </button>
  </div>
  <div id="kb-hint">&larr; &rarr; 방향키로 넘기기</div>
</div>

<script>
const SPREADS = [

[
`<div class="pg dark" style="border-radius:10px 0 0 10px;justify-content:space-between">
<div class="dot-grid"></div>
<div class="cover-accent" style="right:-60px;top:-60px"></div>
<div class="cover-accent" style="left:-80px;bottom:-40px;opacity:.5"></div>
<div style="padding:40px 36px 0;position:relative;z-index:1">
  <div style="font-size:9px;font-weight:700;letter-spacing:.18em;color:#4ECDC4;margin-bottom:22px;text-transform:uppercase">HR AMBASSADOR STUDY &middot; M조 &middot; 2025</div>
  <div style="font-size:9px;color:rgba(255,255,255,.4);margin-bottom:6px;font-weight:500">HR RETENTION PROJECT</div>
  <div style="font-size:28px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:4px;word-break:keep-all">사람이 떠나지<br>않는 구조를</div>
  <div style="font-size:28px;font-weight:900;color:#1DB87A;line-height:1.2;word-break:keep-all">설계하다</div>
  <div style="width:36px;height:3px;background:#1DB87A;margin:18px 0;border-radius:2px"></div>
  <div style="font-size:11.5px;color:rgba(255,255,255,.55);line-height:1.8;word-break:keep-all">채용&ndash;온보딩&ndash;성장을 연결하는<br>HR 공통 플레이북</div>
</div>
<div style="padding:0 36px 36px;position:relative;z-index:1">
  <div style="display:flex;gap:10px;margin-bottom:18px">
    <div style="flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px;text-align:center">
      <div style="font-size:20px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums">5</div>
      <div style="font-size:9px;color:rgba(255,255,255,.4);margin-top:2px">기업 분석</div>
    </div>
    <div style="flex:1;background:rgba(29,184,122,.1);border:1px solid rgba(29,184,122,.2);border-radius:8px;padding:10px;text-align:center">
      <div style="font-size:20px;font-weight:900;color:#1DB87A;font-variant-numeric:tabular-nums">3</div>
      <div style="font-size:9px;color:rgba(29,184,122,.6);margin-top:2px">Phase</div>
    </div>
    <div style="flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px;text-align:center">
      <div style="font-size:20px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums">13</div>
      <div style="font-size:9px;color:rgba(255,255,255,.4);margin-top:2px">출처</div>
    </div>
  </div>
  <div style="font-size:9.5px;color:rgba(255,255,255,.25);word-break:keep-all">메타넷 &middot; 위버스 &middot; 키다리/레진 &middot; 라이나 &middot; BGF로지스</div>
  <div style="font-size:9.5px;color:rgba(255,255,255,.2);margin-top:3px">2024&ndash;2026 최신 HR 데이터 기반</div>
</div>
</div>`,

`<div class="pg cover-r" style="border-radius:0 10px 10px 0;align-items:center;justify-content:center;position:relative">
<div class="dot-grid"></div>
<div class="cover-accent" style="left:-40px;top:80px"></div>

];

let cur = 0;
let isFlipping = false;
const FLIP_DUR = 940;

const leftStatic  = document.getElementById('page-left-static');
const rightBg     = document.getElementById('page-right-bg');
const flipLeaf    = document.getElementById('flip-leaf');
const leafFront   = document.getElementById('leaf-front');
const leafBack    = document.getElementById('leaf-back');
const btnPrev     = document.getElementById('btn-prev');
const btnNext     = document.getElementById('btn-next');
const pageInfo    = document.getElementById('page-info');
const dotsEl      = document.getElementById('dots');
const progressFill= document.getElementById('progress-fill');
const bookContainer=document.getElementById('book-container');

const leftShadow  = document.createElement('div'); leftShadow.id  = 'left-shadow';
const rightShadow = document.createElement('div'); rightShadow.id = 'right-shadow';
const foldCrease  = document.createElement('div'); foldCrease.id  = 'fold-crease';
const leafSheen   = document.createElement('div'); leafSheen.id   = 'leaf-sheen';
bookContainer.append(leftShadow, rightShadow);
flipLeaf.append(leafSheen, foldCrease);

let shadowRaf = null;
function animateShadow(dir, dur) {
  cancelAnimationFrame(shadowRaf);
  const t0 = performance.now();
  function tick(now) {
    const t = Math.min((now - t0) / dur, 1);
    const peakT = dir > 0 ? 0.40 : 0.58;
    const sigma = 0.32;
    const gauss = Math.exp(-0.5 * Math.pow((t - peakT) / sigma, 2));
    const shadow = gauss * 0.82;
    if (dir > 0) { leftShadow.style.opacity = shadow; rightShadow.style.opacity = 0; }
    else { leftShadow.style.opacity = 0; rightShadow.style.opacity = shadow; }
    const crease = t < 0.25 ? (t / 0.25) * 0.9 : t > 0.75 ? ((1 - t) / 0.25) * 0.9 : 0;
    foldCrease.style.opacity = crease;
    const sheen = Math.max(0, 1 - Math.abs(t - 0.50) / 0.18);
    leafSheen.style.opacity = sheen * 0.9;
    if (t < 1) shadowRaf = requestAnimationFrame(tick);
    else { leftShadow.style.opacity = 0; rightShadow.style.opacity = 0; foldCrease.style.opacity = 0; leafSheen.style.opacity = 0; }
  }
  shadowRaf = requestAnimationFrame(tick);
}

function doFlip(dir) {
  if (isFlipping) return;
  const next = cur + dir;
  if (next < 0 || next >= SPREADS.length) return;
  isFlipping = true;
  if (dir > 0) {
    leftStatic.innerHTML = SPREADS[cur][0]; rightBg.innerHTML = SPREADS[next][1];
    leafFront.innerHTML = SPREADS[cur][1]; leafBack.innerHTML = SPREADS[next][0];
    flipLeaf.style.animation = 'none'; flipLeaf.style.transform = 'rotateY(0deg)';
  } else {
    leftStatic.innerHTML = SPREADS[next][0]; rightBg.innerHTML = SPREADS[cur][1];
    leafFront.innerHTML = SPREADS[next][1]; leafBack.innerHTML = SPREADS[cur][0];
    flipLeaf.style.animation = 'none'; flipLeaf.style.transform = 'rotateY(-180deg)';
  }
  void flipLeaf.offsetWidth;
  animateShadow(dir, FLIP_DUR);
  const anim = dir > 0 ? 'flipFwd' : 'flipBwd';
  flipLeaf.style.animation = `${anim} ${FLIP_DUR}ms cubic-bezier(0.25,0.1,0.25,1.0) forwards`;
  flipLeaf.addEventListener('animationend', () => {
    cur = next;
    flipLeaf.style.animation = 'none'; flipLeaf.style.transform = 'rotateY(0deg)';
    leftStatic.innerHTML = SPREADS[cur][0]; leafFront.innerHTML = SPREADS[cur][1];
    rightBg.innerHTML = SPREADS[cur][1];
    leafBack.innerHTML = cur < SPREADS.length - 1 ? SPREADS[cur + 1][0] : '';
    render(); isFlipping = false;
  }, { once: true });
}

function flipNext() { doFlip(+1); }
function flipPrev() { doFlip(-1); }

function goTo(idx) {
  if (idx === cur || isFlipping) return;
  cur = idx;
  flipLeaf.style.animation = 'none'; flipLeaf.style.transform = 'rotateY(0deg)';
  leftStatic.innerHTML = SPREADS[cur][0]; leafFront.innerHTML = SPREADS[cur][1];
  rightBg.innerHTML = SPREADS[cur][1];
  leafBack.innerHTML = cur < SPREADS.length - 1 ? SPREADS[cur + 1][0] : '';
  render();
}

function render() {
  const total = SPREADS.length;
  btnPrev.disabled = cur === 0; btnNext.disabled = cur === total - 1;
  pageInfo.textContent = `${cur + 1} / ${total}`;
  const pct = total > 1 ? (cur / (total - 1)) * 100 : 0;
  progressFill.style.width = pct + '%';
  dotsEl.innerHTML = SPREADS.map((s, i) => `<div class="dot${i === cur ? ' on' : ''}" onclick="goTo(${i})"></div>`).join('');
}

btnNext.onclick = flipNext;
btnPrev.onclick = flipPrev;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipNext();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') flipPrev();
});

leftStatic.innerHTML = SPREADS[0][0]; leafFront.innerHTML = SPREADS[0][1];
rightBg.innerHTML = SPREADS[0][1];
leafBack.innerHTML = SPREADS.length > 1 ? SPREADS[1][0] : '';
render();
</script>
